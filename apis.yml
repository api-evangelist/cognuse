aid: cognuse
name: Cognuse
description: Cognuse is a digital health company offering a comprehensive rehabilitation platform
  for the continuum of care. Its CoNurse product is a guidelines adherence and management system
  that empowers clinicians, caregivers, and family members across the ICU, inpatient rehabilitation,
  and outpatient / chronic-disease-management settings. Capabilities include patient and family
  ICU dashboards, interactive diagnostic and procedural content, therapy and virtual exercises,
  actionable clinical-guideline creation and management, continuous patient education, automated
  discharge documentation, an interactive day planner, and progress visualization and analytics.
  Based in San Diego, California, and backed by 500 Global. This profile was surfaced from a VC
  portfolio and enriched by the API Evangelist pipeline; Cognuse publishes a company/marketing
  site but no public developer or API surface at this time.
